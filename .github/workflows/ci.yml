name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: brew install neovim tmux
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go mod verify
      - run: make test
