name: Release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  release:
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make dist VERSION="$GITHUB_REF_NAME"
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*.tar.gz dist/*.sha256
        env:
          GH_TOKEN: ${{ github.token }}
